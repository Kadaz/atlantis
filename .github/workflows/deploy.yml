name: Deploy Atlantis

on:
push:
branches:
- master

permissions:
contents: write

jobs:
build-and-deploy:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Node
    uses: actions/setup-node@v4
    with:
      node-version: 16
      cache: npm

  - name: Install dependencies
    run: npm ci

  - name: Build Atlantis
    run: npm run build

  - name: Deploy to gh-pages
    run: npx gh-pages -d build
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
```
